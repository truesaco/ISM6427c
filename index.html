<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boca Weather</title>
  <meta name="description" content="Live weather for Boca Raton (FAU) and anywhere else, powered by Open-Meteo.">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('theme') || 'system'; } catch (e) {}
      if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">⛅ <span>Boca Weather</span></div>
    <div class="theme-switch" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-theme-choice="light" aria-label="Light theme" title="Light">☀️</button>
      <button type="button" role="radio" data-theme-choice="dark" aria-label="Dark theme" title="Dark">🌙</button>
      <button type="button" role="radio" data-theme-choice="system" aria-label="System theme" title="System">💻</button>
    </div>
  </header>

  <main class="container">
    <section class="greeting" aria-live="polite">
      <h1 id="greeting">Hello, Alvaro Saco-Vertiz!</h1>
      <p id="greeting-sub">Welcome back. Here's your live weather.</p>
    </section>

    <section class="controls">
      <form id="search-form" class="search" role="search" autocomplete="off">
        <label for="search-input" class="visually-hidden">Search for a city</label>
        <input id="search-input" type="search" placeholder="Search a city…" aria-controls="search-results">
        <ul id="search-results" class="search-results" role="listbox" hidden></ul>
      </form>
      <div class="control-buttons">
        <button type="button" id="btn-home" class="chip" title="Back to Boca Raton (FAU)">🦉 FAU</button>
        <button type="button" id="btn-locate" class="chip" title="Use my location">📍 Me</button>
        <div class="unit-switch" role="radiogroup" aria-label="Temperature units">
          <button type="button" role="radio" data-units="imperial" title="Fahrenheit">°F</button>
          <button type="button" role="radio" data-units="metric" title="Celsius">°C</button>
        </div>
      </div>
    </section>

    <p id="status" class="status" role="status"></p>

    <section id="current" class="card current" hidden>
      <div class="current-main">
        <div>
          <h2 id="place-name">—</h2>
          <p id="updated" class="muted"></p>
        </div>
        <div class="current-temp">
          <span id="current-icon" class="big-icon" aria-hidden="true"></span>
          <span id="current-temp" class="temp"></span>
        </div>
        <p id="current-desc" class="desc"></p>
        <p id="current-hilo" class="muted"></p>
      </div>
      <dl class="stats">
        <div><dt>Feels like</dt><dd id="stat-feels"></dd></div>
        <div><dt>Humidity</dt><dd id="stat-humidity"></dd></div>
        <div><dt>Wind</dt><dd id="stat-wind"></dd></div>
        <div><dt>Precip chance</dt><dd id="stat-precip"></dd></div>
        <div><dt>UV index</dt><dd id="stat-uv"></dd></div>
        <div><dt>Pressure</dt><dd id="stat-pressure"></dd></div>
        <div><dt>Sunrise</dt><dd id="stat-sunrise"></dd></div>
        <div><dt>Sunset</dt><dd id="stat-sunset"></dd></div>
      </dl>
    </section>

    <section id="hourly-card" class="card" hidden>
      <h3>Next 24 hours</h3>
      <ol id="hourly" class="hourly"></ol>
    </section>

    <section id="daily-card" class="card" hidden>
      <h3>7-day forecast</h3>
      <ol id="daily" class="daily"></ol>
    </section>
  </main>

  <footer class="footer">
    Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)
  </footer>

  <script src="app.js"></script>
</body>
</html>
